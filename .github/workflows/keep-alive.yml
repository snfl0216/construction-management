name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 21 * * *'  # 한국시간 06:00
    - cron: '0 3 * * *'   # 한국시간 12:00 (낮 12시)
    - cron: '0 9 * * *'   # 한국시간 18:00 (오후 6시)
    - cron: '0 15 * * *'  # 한국시간 00:00 (자정)
  workflow_dispatch:       # 필요하면 Actions 탭에서 수동으로도 실행 가능

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 필요한 패키지 설치
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: 사이트 방문해서 필요하면 깨우기
        run: python keep_awake.py